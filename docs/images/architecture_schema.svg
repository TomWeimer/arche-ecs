<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1420" width="100%" height="auto" style="background-color: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <linearGradient id="runtimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- ============================================================= -->
  <!-- LAYER 0: FOUNDATION                                            -->
  <!-- ============================================================= -->
  <g transform="translate(130, 20)">
    <rect width="500" height="96" rx="14" fill="#111827" stroke="#1f293d" stroke-width="2" />
    <text x="250" y="24" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">LAYER 0 — FOUNDATION (src/foundation/)</text>
    <text x="250" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">Hardware intrinsics, generational handles &amp; core bitmask primitives</text>

    <!-- Inner Sub-boxes -->
    <g transform="translate(20, 50)">
      <rect x="0" width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="52.5" y="21" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">entity</text>

      <rect x="117" width="115" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="174.5" y="21" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">component</text>

      <rect x="244" width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="296.5" y="21" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">hardware</text>

      <rect x="361" width="99" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="410.5" y="21" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">types</text>
    </g>
  </g>

  <!-- Arrow: Layer 0 -> Layer 1 -->
  <line x1="380" y1="116" x2="380" y2="148" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ============================================================= -->
  <!-- LAYER 1: STORAGE                                               -->
  <!-- ============================================================= -->
  <g transform="translate(130, 150)">
    <rect width="500" height="96" rx="14" fill="#111827" stroke="#1f293d" stroke-width="2" />
    <text x="250" y="24" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">LAYER 1 — STORAGE (src/storage/)</text>
    <text x="250" y="40" fill="#94a3b8" font-size="10" text-anchor="middle">Independent memory page slabs, slot routing, resources &amp; command queues</text>

    <g transform="translate(20, 50)">
      <rect x="0" width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="52.5" y="21" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">chunk</text>

      <rect x="117" width="115" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="174.5" y="21" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">slot_map</text>

      <rect x="244" width="105" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="296.5" y="21" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">resource</text>

      <rect x="361" width="99" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="410.5" y="21" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">command</text>
    </g>
  </g>

  <!-- Arrow: Layer 1 -> Layer 2 -->
  <line x1="380" y1="246" x2="380" y2="278" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ============================================================= -->
  <!-- LAYER 2: ARCHETYPE                                             -->
  <!-- ============================================================= -->
  <g transform="translate(240, 280)">
    <rect width="280" height="54" rx="12" fill="#111827" stroke="#1f293d" stroke-width="2" />
    <text x="140" y="22" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">LAYER 2 — ARCHETYPE</text>
    <text x="140" y="39" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">src/archetype/</text>
  </g>

  <!-- Arrow: Layer 2 -> Layer 3 -->
  <line x1="380" y1="334" x2="380" y2="366" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ============================================================= -->
  <!-- LAYER 3: MUTATION                                              -->
  <!-- ============================================================= -->
  <g transform="translate(240, 368)">
    <rect width="280" height="54" rx="12" fill="#111827" stroke="#1f293d" stroke-width="2" />
    <text x="140" y="22" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">LAYER 3 — MUTATION</text>
    <text x="140" y="39" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">src/mutation/ (mutation.cppm)</text>
  </g>

  <!-- Arrow: Layer 3 -> Runtime Enclosure -->
  <line x1="380" y1="422" x2="380" y2="454" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ============================================================= -->
  <!-- RUNTIME ENCLOSURE                                              -->
  <!-- ============================================================= -->
  <g transform="translate(60, 456)">
    <!-- Outer Runtime Enclosure Box -->
    <rect width="640" height="580" rx="18" fill="url(#runtimeGrad)" stroke="#4338ca" stroke-width="2" stroke-dasharray="6 4" />
    <text x="320" y="28" fill="#a855f7" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">RUNTIME SUBSYSTEM (src/runtime/)</text>
    <text x="320" y="44" fill="#94a3b8" font-size="10" text-anchor="middle">Execution engine coordinating concurrency, iteration, access footprints &amp; DAG scheduling</text>

    <!-- 1. concurrency -->
    <g transform="translate(210, 60)">
      <rect width="220" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="110" y="26" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">concurrency</text>
    </g>

    <!-- Branching Arrow: concurrency -> query & sort -->
    <path d="M 320 102 L 320 126 M 320 126 L 200 126 L 200 148 M 320 126 L 440 126 L 440 148" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

    <!-- 2. query (left) & sort (right) -->
    <g transform="translate(90, 150)">
      <rect x="0" width="220" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="110" y="27" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">query</text>

      <rect x="240" width="220" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="350" y="27" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">sort</text>
    </g>

    <!-- Joining Arrow: query & sort -> access -->
    <path d="M 200 194 L 200 216 L 320 216 M 440 194 L 440 216 L 320 216 M 320 216 L 320 238" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

    <!-- 3. access -->
    <g transform="translate(210, 240)">
      <rect width="220" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="110" y="26" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">access</text>
    </g>

    <!-- Arrow: access -> system -->
    <line x1="320" y1="282" x2="320" y2="318" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 4. system -->
    <g transform="translate(210, 320)">
      <rect width="220" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="110" y="26" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">system</text>
    </g>

    <!-- Arrow: system -> scheduler -->
    <line x1="320" y1="362" x2="320" y2="398" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 5. scheduler -->
    <g transform="translate(210, 400)">
      <rect width="220" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="110" y="26" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">scheduler</text>
    </g>

    <!-- Arrow: scheduler -> plugin -->
    <line x1="320" y1="442" x2="320" y2="478" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- 6. plugin -->
    <g transform="translate(210, 480)">
      <rect width="220" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="110" y="26" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">plugin</text>
    </g>

    <!-- Arrow leaving plugin out of enclosure -->
    <line x1="320" y1="522" x2="320" y2="580" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Arrow extending from Runtime to Layer 10 -->
  <line x1="380" y1="1036" x2="380" y2="1068" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ============================================================= -->
  <!-- LAYER 10: VIEWS                                                -->
  <!-- ============================================================= -->
  <g transform="translate(240, 1070)">
    <rect width="280" height="54" rx="12" fill="#111827" stroke="#1f293d" stroke-width="2" />
    <text x="140" y="22" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">LAYER 10 — VIEWS</text>
    <text x="140" y="39" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">src/views/</text>
  </g>

  <!-- Arrow: Layer 10 -> Layer 11 -->
  <line x1="380" y1="1124" x2="380" y2="1156" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ============================================================= -->
  <!-- LAYER 11: WORLD                                                -->
  <!-- ============================================================= -->
  <g transform="translate(240, 1158)">
    <rect width="280" height="54" rx="12" fill="#111827" stroke="#1f293d" stroke-width="2" />
    <text x="140" y="22" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">LAYER 11 — WORLD</text>
    <text x="140" y="39" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">src/world/</text>
  </g>

  <!-- Arrow: Layer 11 -> Layer 12 -->
  <line x1="380" y1="1212" x2="380" y2="1244" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ============================================================= -->
  <!-- LAYER 12: ARCHE MASTER MODULE                                  -->
  <!-- ============================================================= -->
  <g transform="translate(210, 1246)">
    <rect width="340" height="64" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
    <text x="170" y="26" fill="#38bdf8" font-size="12" font-weight="800" letter-spacing="1" text-anchor="middle">LAYER 12 — UMBRELLA MODULE</text>
    <text x="170" y="46" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">src/arche.cppm  (import arche;)</text>
  </g>
</svg>
